<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
  
  <!-- A letter -->
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">A</text>
  
  <!-- Eye/AI indicator -->
  <circle cx="50" cy="30" r="6" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Microphone waves (left) -->
  <g stroke="white" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 25 50 Q 20 50 20 55" />
    <path d="M 22 50 Q 15 50 15 58" />
  </g>
  
  <!-- Microphone waves (right) -->
  <g stroke="white" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 75 50 Q 80 50 80 55" />
    <path d="M 78 50 Q 85 50 85 58" />
  </g>
</svg>
